[honeypot]
hostname = sin-portal
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
share_path = var/lib/cowrie/share
state_path = var/lib/cowrie

[backend_spool]
enabled = true
unique_value = sin
max_size = 50

[backend_json]
enabled = true
log_level = info

[backend_udp]
enabled = false

[backend_tcp]
enabled = false

[shell]
filesystem = src/cowrie/commands/fs.py
processes = src/cowrie/commands/processes.py
version = 2.12.0

[ssh]
enabled = true
rsa_public_key = etc/ssh_host_rsa_key.pub
rsa_private_key = etc/ssh_host_rsa_key
dsa_public_key = etc/ssh_host_dsa_key.pub
dsa_private_key = etc/ssh_host_dsa_key
ecdsa_public_key = etc/ssh_host_ecdsa_key.pub
ecdsa_private_key = etc/ssh_host_ecdsa_key
ed25519_public_key = etc/ssh_host_ed25519_key.pub
ed25519_private_key = etc/ssh_host_ed25519_key
version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

[telnet]
enabled = true
version = Linux 5.15.0

[interact]
enabled = true

[forward]
enabled = false

[proxy]
enabled = false
backend = proxy

[filesystem]
contents = share/cowrie/fs.pickle
file_read_limit = 100KB

[output_json]
enabled = true
epoch_timestamp = false
timestamp_format = %Y-%m-%dT%H:%M:%S.%fZ
indent = -1

[output_text]
enabled = false
log_level = info

[output_audit]
enabled = false
log_level = info

[auth_class]
max_auth_tries = 3
