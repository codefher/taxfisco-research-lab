apiVersion: 1

# Datasources provisionados del Prototipo II (laboratorio SIN).
#
# Correcciones aplicadas tras verificar la ejecucion real (2026-10-04):
#   - Wazuh Indexer: estaba en http://10.22.0.13:9200. El indice real esta en
#     10.22.0.11 y SOLO habla TLS, de ahi el https y tlsSkipVerify (cert
#     autofirmado del laboratorio).
#   - TheHive: estaba en http://10.22.0.31:9200, que no existe. TheHive no
#     tiene Elasticsearch propio: indexa en el mismo Wazuh Indexer, indice
#     thehive_global, asi que apunta al mismo host con database thehive*.
#   - MISP: 10.22.0.21 es misp-db (correcto). La password se escribe en claro
#     porque el provisioning de Grafana no expande ${MISP_DB_PASSWORD}.
datasources:
  - name: WazuhIndexer
    type: elasticsearch
    access: proxy
    url: https://10.22.0.11:9200
    database: "wazuh-alerts*"
    isDefault: true
    editable: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin   # clave real del indice Wazuh (securityadmin -icl)
    jsonData:
      esVersion: "2.19.5"
      timeField: "@timestamp"
      tlsSkipVerify: true
      authEnabled: true
      timeInterval: "1s"

  - name: TheHive
    type: elasticsearch
    access: proxy
    url: https://10.22.0.11:9200
    database: "thehive*"
    editable: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin
    jsonData:
      esVersion: "2.19.5"
      timeField: "_source.createdAt"
      tlsSkipVerify: true
      authEnabled: true
      timeInterval: "1s"

  - name: MISP
    type: mysql
    access: proxy
    url: 10.22.0.21:3306
    database: misp
    user: misp
    secureJsonData:
      password: ChangeMe_Strong!
    jsonData:
      timeField: "timestamp"
