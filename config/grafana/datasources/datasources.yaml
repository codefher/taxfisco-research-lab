apiVersion: 1

datasources:
  - name: WazuhIndexer
    type: grafana-opensearch-datasource
    access: proxy
    url: http://10.22.0.13:9200
    database: "wazuh-alerts-*"
    isDefault: true
    editable: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin   # clave real del indice Wazuh (securityadmin -icl)
    jsonData:
      flavor: "opensearch"
      version: "1.2.0"
      timeField: "timestamp"
      tlsMode: "disable"
      authEnabled: true
      timeInterval: "1s"

  - name: TheHive
    type: elasticsearch
    access: proxy
    url: http://10.22.0.31:9200
    database: "thehive*"
    editable: true
    jsonData:
      timeField: "_source.createdAt"
      esVersion: "7.10.2"
      tlsMode: "disable"

  - name: MISP
    type: mysql
    access: proxy
    url: 10.22.0.21:3306
    database: misp
    user: misp
    secureJsonData:
      password: ${MISP_DB_PASSWORD}
    jsonData:
      timeField: "timestamp"

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
