# TheHive configuration for TaxFisco Research Lab - LITE EDITION
# ================================================================
# En el plan LITE (16 GB), TheHive reutiliza el Elasticsearch de Wazuh
# (índice dedicado "thehive") para ahorrar 1.5 GB de RAM.
#
# Perfil del laboratorio: 16 GB de RAM
# TheHive reutiliza el Elasticsearch de Wazuh (en 172.22.0.11)
# con índice dedicado "thehive" para ahorrar 1.5 GB de RAM
# que de otra forma se usaría en un ES dedicado.

play.modules.enabled += "org.thp.thehive.IndexerModule"

include "/etc/thehive/application.conf"

# Secret key for session encryption
play.http.secret.key = "${THEHIVE_SECRET}"
play.http.secret.key = "TheHive_SecretKey_2024_ChangeInProduction"

# Database
db {
  provider = local
  local {
    path = "/var/lib/thehive/data"
  }
}

# Indexer - REUTILIZA Wazuh Indexer (LITE)
search {
  provider = elastic
  elastic {
    servers = ["http://172.22.0.11:9200"]
    index = thehive
    username = ""
    password = ""
  }
}

# Storage
storage {
  provider = local
  local {
    path = "/var/lib/thehive/files"
  }
}

# Notification
notification {
  email {
    from = "thehive@taxfisco.local"
    to = ["soc@taxfisco.local"]
    smtp {
      host = "localhost"
      port = 25
    }
  }
}

# Webhooks to Shuffle
webhook {
  url = "http://172.22.0.40:5000/api/v1/hooks/thehive"
}

# Services
services {
  cortex {
    server = "http://172.22.0.32:9001"
  }
}

# Authentication
authentication {
  provider = local
}

# Audit
audit {
  logger = audit
  log {
    path = "/var/log/thehive/audit.log"
  }
}
