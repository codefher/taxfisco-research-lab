# TheHive configuration for TaxFisco Research Lab - LITE EDITION
# ================================================================
# Este archivo se incluye AL FINAL del application.conf generado por
# el entrypoint de TheHive 5.5. Por lo tanto solo sobreescribimos
# lo que necesitamos y NO tocamos `db` (lo maneja el entrypoint con
# las variables TH_*).

# Secret key para Play Framework (requerido en prod mode)
play.http.secret.key = "TheHive_SecretKey_2024_ChangeInProduction"

# Sobrescribir el hostname del index ES dentro de db.janusgraph.
# Wazuh Indexer solo expone HTTPS; el proxy nginx traduce a HTTP para
# que JanusGraph/ElasticSearchIndex pueda conectarse sin SSL.
# IMPORTANTE: el path debe ser db.janusgraph.index.search.hostname
# (no index.search.hostname) porque la entrypoint lo puso dentro de
# db.janusgraph {}.
db.janusgraph.index.search.hostname = ["wazuh-indexer-proxy:9200"]

# Storage adicional si el entrypoint no lo configura
storage {
  provider = localfs
  localfs {
    location = "/var/lib/thehive/files"
  }
}

# Services
services {
  cortex {
    server = "http://172.22.0.32:9001"
  }
}

# Webhooks a Shuffle
webhook {
  url = "http://172.22.0.40:5000/api/v1/hooks/thehive"
}
