# Dionaea honeypot configuration for TaxFisco Research Lab

[dionaea]
download.dir = /opt/dionaea/var/lib/dionaea/binaries
bistream.dir = /opt/dionaea/var/lib/dionaea/bistreams
log.file = /opt/dionaea/var/log/dionaea/dionaea.log
modules.dir = /opt/dionaea/lib/dionaea/python3
modules = python3

[processor]
python3 = yes

[logging]
default = file:///opt/dionaea/var/log/dionaea/dionaea.log

[processor.emu]
services = http, smb, ftp, tftp, sip, mssql, mysql, pcap, mirror

[processor.emu.profiles]
default = emu

[module.streamd]
mode = getifaddrs
listen = any

[services]
http = yes
smb = yes
ftp = yes
tftp = yes
sip = yes
mssql = yes
mysql = yes

[services.http]
port = 80
banner = Apache/2.4.41 (Ubuntu)

[services.smb]
port = 445
name = *SMBSERVER
comment = TaxFisco SMB
workgroup = WORKGROUP

[services.ftp]
port = 21
banner = vsftpd 3.0.3

[services.sip]
port = 5060
port_tls = 5061
realm = taxfisco.local
user_agent = TaxFisco SIP Server
sessions = 5

[services.mssql]
port = 1433
banner = Microsoft SQL Server 2019

[services.mysql]
port = 3306
banner = 5.7.38-0ubuntu0.18.04.1
