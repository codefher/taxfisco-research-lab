{
  "device.node_id": "taxfisco-opencanary",

  "ip.bind.listen_address": "0.0.0.0",

  "port.http": 80,
  "port.http.banner": "Apache/2.4.41 (Ubuntu)",
  "port.http.skin": "basicLogin",

  "port.https": null,
  "port.ssh": 22,
  "port.ssh.banner": "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6",
  "port.ssh.skin": null,

  "port.telnet": 23,
  "port.telnet.banner": "Ubuntu 22.04 LTS\\r\\nlogin: ",

  "port.ftp": 21,
  "port.ftp.banner": "vsftpd 3.0.3",

  "port.smb": 445,
  "port.smb.banner": null,

  "port.rdp": 3389,
  "port.rdp.banner": null,

  "port.mysql": 3306,
  "port.mysql.banner": "5.7.38-0ubuntu0.18.04.1",

  "port.mssql": 1433,
  "port.mssql.banner": null,

  "port.postgres": null,
  "port.redis": null,

  "port.sip": null,

  "port.ntp": null,
  "port.tftp": null,

  "port.vnc": null,
  "port.upnp": null,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout",
          "formatter": "plain"
        }
      }
    }
  },

  "handlers": {
    "FTP": {
      "class": "OpenCanary::FTP::Server"
    },
    "HTTP": {
      "class": "OpenCanary::HTTP::Server"
    },
    "SSH": {
      "class": "OpenCanary::SSH::Server"
    },
    "SMB": {
      "class": "OpenCanary::SMB::Server"
    },
    "MySQL": {
      "class": "OpenCanary::MySQL::Server"
    },
    "MSSQL": {
      "class": "OpenCanary::MSSQL::Server"
    },
    "Telnet": {
      "class": "OpenCanary::Telnet::Server"
    },
    "NTP": {
      "class": "OpenCanary::NTP::Server"
    },
    "TFTP": {
      "class": "OpenCanary::TFTP::Server"
    },
    "RDP": {
      "class": "OpenCanary::RDP::Server"
    },
    "VNC": {
      "class": "OpenCanary::VNC::Server"
    },
    "SIP": {
      "class": "OpenCanary::SIP::Server"
    }
  },

  "alerts": {
    "snmp": {
      "class": "OpenCanary::Alert::SNMP",
      "options": {}
    }
  }
}
