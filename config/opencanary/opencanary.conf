{
    "device.node_id": "sin-opencanary",
    "ip.ignorelist": [  ],
    "logtype.ignorelist": [  ],

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "vsftpd 3.0.3",
    "ftp.log_auth_attempt_initiated": true,

    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.41 (Ubuntu)",
    "http.skin": "basicLogin",
    "http.log_unimplemented_method_requests": true,
    "http.log_redirect_request": true,

    "ssh.enabled": true,
    "ssh.port": 22,
    "ssh.version": "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6",

    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "Ubuntu 22.04 LTS",
    "telnet.log_tcp_connection": true,

    "smb.enabled": false,
    "smb.auditfile": "/var/log/samba-audit.log",

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.38-0ubuntu0.18.04.1",
    "mysql.log_connection_made": true,

    "mssql.enabled": true,
    "mssql.port": 1433,
    "mssql.version": "2012",

    "rdp.enabled": true,
    "rdp.port": 3389,

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                },
                "syslog_rfc": {
                    "format": "opencanaryd[%(process)-5s:%(thread)d]: %(name)s %(levelname)-5s %(message)s"
                }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/tmp/opencanary.log"
                }
            }
        }
    }
}
