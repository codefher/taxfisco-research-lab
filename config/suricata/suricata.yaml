%YAML 1.1
---
# Suricata configuration for SIN Research Lab
# Detección de amenazas a nivel de red (NIDS)

vars:
  address-groups:
    HOME_NET: "[10.20.0.0/16,10.21.0.0/16,10.22.0.0/16,10.23.0.0/16]"
    EXTERNAL_NET: "any"
    HTTP_SERVERS: "[10.20.0.20,10.20.0.21,10.20.0.50,10.20.0.52,10.20.0.53]"
    SQL_SERVERS: "[10.20.0.30]"
    DNS_SERVERS: "[10.20.0.30]"

  port-groups:
    HTTP_PORTS: "[80,443,2222,2323,8000,8080,8081,8888]"
    SSH_PORTS: "[22,2222,2223]"
    FTP_PORTS: "[21,2121]"
    SIP_PORTS: "[5060]"

default-log-dir: /var/log/suricata/

stats:
  enabled: yes
  interval: 8
  outputs:
    - stats.log

outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - dns
        - tls
        - files
        - smtp
        - flow
        - ssh
        - stats

  # Salida EVE dedicada a la ingesta del SIEM: unicamente eventos de tipo
  # alert. eve.json incluye types con objetos anidados muy grandes (stats,
  # flow, tls) que el decodificador JSON de wazuh-analysisd rechaza con
  # "Too many fields for JSON decoder". eve.json se conserva integro para
  # la evidencia de la tesis; Wazuh lee este archivo.
  - eve-log:
      enabled: yes
      filetype: regular
      filename: alert-events.json
      types:
        - alert

  - http-log:
      enabled: yes
      filename: http.log
      append: yes

af-packet:
  - interface: eth0
    cluster-id: 99
    defrag: yes
    copy-mode: tap
    # copy-iface: eth1  # DESHABILITADO para NIDS en single-host (LITE)

flow:
  memcap: 128mb
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30

stream:
  memcap: 64mb

app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100mb
          response-body-limit: 100mb

    tls:
      enabled: yes

    ssh:
      enabled: yes

    smtp:
      enabled: yes

    dns:
      enabled: yes

    ftp:
      enabled: yes

    sip:
      enabled: yes

    smb:
      enabled: yes

    mssql:
      enabled: yes

    http2:
      enabled: yes

asn1-max-frames: 256

host-mode: auto

engine-analysis:
  rules-fast-pattern: yes
  corssbench: yes

defrag:
  memcap: 32mb

detect:
  transform-list:
    - dotprefix
    - lowercase
    - compress_whitespace
    - strip_whitespace
    - strip_pseudo_headers

mpm-algo: auto

pcre:
  match-limit: 3500
  match-limit-recursion: 1500

spm-algo: auto

threading:
  set-cpu-affinity: no
  cpu-affinity:
    - management-cpu-set:
        cpu: [ 0 ]
    - worker-cpu-set:
        cpu: [ "all" ]
  manage-cpu: yes

luajit:
  states: 128

coredump:
  max-dump: 0

default-rule-path: /etc/suricata/rules
rule-files:
  - suricata.rules
  # ET rules disabled in LITE (no volume mount). To enable, download ET Open Ruleset
  # and add files here, then re-mount ./config/suricata/rules with all ET files.

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
