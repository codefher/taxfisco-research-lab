# Cortex configuration for TaxFisco Research Lab - LITE EDITION
# ===============================================================
# En el plan LITE (16 GB), Cortex también reutiliza el Elasticsearch
# de Wazuh Indexer (índice "cortex") para ahorrar RAM.

include "/etc/cortex/application.conf"

# Secret key
play.http.secret.key = "${CORTEX_SECRET}"
play.http.secret.key = "Cortex_SecretKey_2024_ChangeInProduction"

# Elasticsearch para jobs de analyzers - REUTILIZA Wazuh Indexer (LITE)
search {
  provider = elastic
  elastic {
    servers = ["http://172.22.0.11:9200"]
    index = cortex
  }
}

# Job storage
job {
  runner = local
  local {
    path = "/tmp/cortex-jobs"
  }
}

# Workers - LITE: reducido de 4 a 2
worker {
  count = 2
}

# Analyzers path
analyzer {
  path = [
    "/opt/cortex/analyzers"
  ]
}

# Responders
responder {
  path = [
    "/opt/cortex/responders"
  ]
}

# Services
services {
  analyzers {
    auto = true
    folder = /opt/cortex/analyzers
  }
}
