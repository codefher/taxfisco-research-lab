# Cortex - Prototipo II (SIN)
# ===========================
# Reutiliza el indice de Wazuh. Las claves de conexion son planas
# (search.uri / search.user / search.password) en Cortex 4.1.
#
# Analizadores: se ejecutan como procesos locales (job.runner = process)
# porque el contenedor no tiene acceso al socket de Docker ni a Kubernetes.
# Los analizadores viven en config/cortex/analyzers (montado en /opt/cortex/analyzers).

play.http.secret.key = "${CORTEX_SECRET}"
play.http.secret.key = "Cortex_SecretKey_2024_ChangeInProduction"

search {
  uri = "http://wazuh-indexer-proxy:9200"
  user = "admin"
  password = "admin"
  index = cortex
}

job {
  runner = process
  directory = "/tmp/cortex-jobs"
}
worker { count = 2 }

analyzer { urls = ["/opt/cortex/analyzers"] }
responder { urls = [] }

