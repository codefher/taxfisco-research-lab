# =============================================================================
# Honeypot Methodology for Incident Management in Fiscal Services
# Master Thesis - TaxFisco Research Lab
# LITE EDITION - 16 GB RAM Profile
# =============================================================================
#
# Esta es la versión LITE del laboratorio, optimizada para ejecutarse en
# equipos con 16 GB de RAM. Esta es la versión LITE del laboratorio.
# El plan original completo (32 GB) está en lab-1/ y mantiene la cobertura
# completa sin las adaptaciones que aquí se documentan. Esta versión LITE
# realiza las siguientes adaptaciones:
#
# 1. Reducción de mem_limit en todos los servicios (-7.5 GB total)
# 2. Eliminación del contenedor thehive.es (ahorra 1.5 GB)
#    TheHive ahora reutiliza el Elasticsearch de Wazuh (índice dedicado)
# 3. Reducción del heap JVM de Wazuh Indexer (1g → 768m)
# 4. Reducción de workers PHP-FPM en MISP
# 5. Cap del contenedor atacante Kali (CLI-only)
#
# Networks:
#   dmz-net       (10.20.0.0/24) - Public-facing decoys and services
#   honeypot-net  (10.21.0.0/24) - High-interaction honeypots
#   soc-net       (10.22.0.0/24) - SOC tooling (SIEM, SOAR, IRP, TI)
#   ids-net       (10.23.0.0/24) - Network sensors
#
# Resource budget (16 GB host + 8 GB swap):
#   Wazuh stack:    ~3.3 GB  (lite)
#   MISP:           ~1.8 GB  (lite)
#   TheHive/Cortex: ~1.4 GB  (sin ES propio, reutiliza Wazuh)
#   Shuffle:        ~0.9 GB  (lite)
#   Velociraptor:   ~0.25 GB
#   Grafana:        ~0.25 GB
#   Honeypots:      ~1.1 GB
#   Decoys:         ~0.7 GB
#   IDS/NDR:        ~0.7 GB
#   Postgres:       ~0.25 GB
#   Host OS:        ~2.5 GB
#   ─────────────────────
#   Total:         ~13.2 GB  (cabe en 16 GB)
#   Swap:           8 GB     (picos de RAM se mueven a disco)
#
# Ver PERFIL-LITE-16GB.md para la guía operativa detallada.
# =============================================================================

name: sin-research-lab

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ===========================================================================
  # SOC NETWORK - WAZUH SIEM (REDUCIDO)
  # ===========================================================================
  wazuh.manager:
    image: wazuh/wazuh-manager:4.10.4
    container_name: sin-wazuh-manager
    hostname: wazuh-manager
    networks:
      soc-net:
        ipv4_address: 10.22.0.10
    ports:
      - "1514:1514/udp"   # agent enrollment
      - "1514:1514/tcp"   # agent communication
      # 55000 manager API not exposed to host (Docker Desktop port forwarding issue)
      # Use docker exec to access if needed
    environment:
      - WAZUH_MANAGER_VERSION=4.10.4
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - ./config/wazuh:/wazuh-config:ro
      - ./config/wazuh/certs:/etc/wazuh-manager/certs:ro
      - /etc/localtime:/etc/localtime:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1.5g  # LITE: era 2g

  wazuh.indexer:
    image: sin/wazuh-indexer:4.10.4-lite
    container_name: sin-wazuh-indexer
    hostname: wazuh-indexer
    networks:
      soc-net:
        ipv4_address: 10.22.0.11
    environment:
      # LITE: heap reducido. Xms == Xmx (requerido por bootstrap checks)
      - "OPENSEARCH_JAVA_OPTS=-Xms768m -Xmx768m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./config/wazuh/certs:/etc/wazuh-indexer/certs:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 2g  # Aumentado desde 1g (host tiene 31GB RAM)

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.10.4
    container_name: sin-wazuh-dashboard
    hostname: wazuh-dashboard
    networks:
      soc-net:
        ipv4_address: 10.22.0.12
    ports:
      - "1443:5601/tcp"    # Kibana dashboard (puerto cambiado de 443 a 1443)
    environment:
      - WAZUH_DASHBOARD_VERSION=4.10.4
      - OPENSEARCH_HOSTS=["https://10.22.0.11:9200"]
    depends_on:
      - wazuh.indexer
    volumes:
      - ./config/wazuh/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh/certs:/etc/wazuh-dashboard/certs:ro
      - wazuh_dashboard_data:/var/lib/wazuh-dashboard
      - ./config/wazuh/dashboard:/wazuh-dashboard/app/plugins/main/wazuh/public/assets:ro
      - ./config/wazuh/certs:/etc/wazuh-dashboard/certs:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m  # LITE: era 1g

  # ===========================================================================
  # SOC NETWORK - MISP THREAT INTELLIGENCE (REDUCIDO)
  # ===========================================================================
  misp.core:
    image: coolacid/misp-docker:core-latest
    container_name: sin-misp-core
    hostname: misp-core
    networks:
      soc-net:
        ipv4_address: 10.22.0.20
    ports:
      - "8443:443/tcp"    # MISP web UI
      - "6666:6666/tcp"   # ZeroMQ
    environment:
      - HOSTNAME=sin-misp
      - BASEURL=https://localhost:8443
      - MYSQL_HOST=misp.db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:-ChangeMe_Strong!}
      - ADMIN_EMAIL=admin@sin.local
      - ADMIN_PASSWORD=${MISP_ADMIN_PASSWORD:-AdminMISP_2024!}
      - DISIPLINES=*
      # LITE: reducción de workers PHP-FPM
      - PHP_FPM_PM_MAX_CHILDREN=5
      - PHP_FPM_PM_START_SERVERS=2
      - PHP_FPM_PM_MIN_SPARE_SERVERS=1
      - PHP_FPM_PM_MAX_SPARE_SERVERS=3
      # Fix for cron CRON_USER_ID env var
      - CRON_USER_ID=1
    depends_on:
      - misp.db
    volumes:
      - misp_data:/var/www/MISP
      - misp_config:/etc/ossim
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g  # LITE: era 1.5g

  misp.redis:
    image: redis:7-alpine
    container_name: sin-misp-redis
    hostname: misp.redis
    networks:
      soc-net:
        ipv4_address: 10.22.0.50
        # MISP resuelve su Redis por el nombre corto "redis" (config.php
        # redis_host y ZeroMQ_redis_host), no por el hostname del servicio.
        aliases:
          - redis
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m

  misp.db:
    image: mysql:8.0
    container_name: sin-misp-db
    hostname: misp-db
    networks:
      soc-net:
        ipv4_address: 10.22.0.21
    environment:
      - MYSQL_ROOT_PASSWORD=${MISP_DB_ROOT_PASSWORD:-RootMISP_2024!}
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:-ChangeMe_Strong!}
    command:
      - --default-authentication-plugin=mysql_native_password
      # LITE: configuración reducida de MySQL
      - --innodb-buffer-pool-size=384M
      - --max-connections=50
      - --innodb-log-file-size=64M
    volumes:
      - misp_db_data:/var/lib/mysql
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m  # LITE: era 1g

  misp.modules:
    image: coolacid/misp-docker:modules-latest
    container_name: sin-misp-modules
    hostname: misp-modules
    networks:
      soc-net:
        ipv4_address: 10.22.0.22
    environment:
      - MISP_MODULES_URL=http://sin-misp-modules:6666
    depends_on:
      - misp.core
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # ===========================================================================
  # SOC NETWORK - THEHIVE + CORTEX (SIN ES PROPIO - REUTILIZA WAZUH)
  # ===========================================================================
  # LITE: Se eliminó el servicio thehive.es (ahorra 1.5 GB)
  # TheHive ahora usa el Elasticsearch de Wazuh Indexer con índice dedicado "thehive"
  # NOTA: TheHive 5.5 sigue requiriendo Cassandra (Scalligraph/JanusGraph) -
  # por eso se reincorpora cassandra.thehive al perfil lite.
  cassandra.thehive:
    image: cassandra:4.1
    container_name: sin-cassandra
    hostname: cassandra-thehive
    networks:
      soc-net:
        ipv4_address: 10.22.0.31
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=1G
      - CASSANDRA_NUM_TOKENS=16
    volumes:
      - cassandra_data:/var/lib/cassandra
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1.2g

  thehive:
    image: strangebee/thehive:5.5
    container_name: sin-thehive
    hostname: thehive
    networks:
      soc-net:
        ipv4_address: 10.22.0.30
    ports:
      - "9000:9000/tcp"   # TheHive API
    environment:
      - THEHIVE_SECRET=${THEHIVE_SECRET:-TheHive_SecretKey_2024}
      - TH_SECRET=${THEHIVE_SECRET:-TheHive_SecretKey_2024}
      - TH_CQL_HOSTNAMES=cassandra.thehive
      - TH_CQL_USERNAME=
      - TH_CQL_PASSWORD=
      - TH_CQL_KEYSPACE=thehive
      - TH_CQL_DATACENTER=datacenter1
      - TH_ELASTICSEARCH_HOSTNAMES=wazuh.indexer
      - TH_ELASTICSEARCH_INDEX=thehive
      - TH_ELASTICSEARCH_USERNAME=admin
      - TH_ELASTICSEARCH_PASSWORD=${WAZUH_INDEXER_PASSWORD:-admin}
      - TH_INDEX_BACKEND=elasticsearch
      - TH_STORAGE_DIRECTORY=/var/lib/thehive/files
      - TH_NO_CONFIG_SECRET=1
      - TH_NO_CONFIG_STORAGE=1
      - TH_NO_CONFIG_CORTEX=1
    depends_on:
      - cassandra.thehive
      - cortex
      - wazuh.indexer    # LITE: depende de wazuh.indexer (no de thehive.es)
    volumes:
      - thehive_data:/var/lib/thehive/files
      - ./config/thehive/application.conf:/etc/thehive/application.conf:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g  # LITE: era 1.5g

  cortex:
    image: thehiveproject/cortex:4.1.0
    container_name: sin-cortex
    hostname: cortex
    networks:
      soc-net:
        ipv4_address: 10.22.0.32
    ports:
      - "9001:9001/tcp"   # Cortex API
    volumes:
      - cortex_data:/var/lib/cortex
      - ./config/cortex/application.conf:/etc/cortex/application.conf:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # ===========================================================================
  # SOC NETWORK - SHUFFLE SOAR (REDUCIDO)
  # ===========================================================================
  shuffle:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: sin-shuffle
    hostname: shuffle
    networks:
      soc-net:
        ipv4_address: 10.22.0.40
        aliases:
          - shuffle-backend
    ports:
      - "3443:3443/tcp"   # Orborus worker (UI va por shuffle.frontend en 3001)
    environment:
      - SHUFFLE_APP_SHUFFLE_ORBORUS=orborus
      - SHUFFLE_APP_DB_LOCATION=db
      - SHUFFLE_DB_LOCATION=shuffle.db
      # LITE: workers reducidos
      - SHUFFLE_WORKER_AMOUNT=2
      # OpenSearch apunta al proxy HTTP de Wazuh (con alias shuffle-opensearch)
      # El proxy requiere auth basica (admin:admin = default wazuh)
      - SHUFFLE_OPENSEARCH_URL=http://admin:Admin1234!@shuffle-opensearch:9200
      - SHUFFLE_ELASTIC_URL=http://admin:Admin1234!@shuffle-opensearch:9200
      - DATABASE_URL=sqlite:///opt/shuffle/shuffle.db
    depends_on:
      - shuffle.db
    volumes:
      - shuffle_data:/opt/shuffle
      - ./config/shuffle/workflows:/opt/shuffle/workflows:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m  # LITE: era 1g

  shuffle.frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: sin-shuffle-frontend
    hostname: shuffle-frontend
    networks:
      soc-net:
        ipv4_address: 10.22.0.41
    ports:
      - "3001:80/tcp"   # UI expuesta en 3001 (nginx del frontend escucha en 80)
    environment:
      - BACKEND_URL=http://shuffle:5001
    depends_on:
      - shuffle
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m  # LITE: era 256m

  shuffle.db:
    image: postgres:15-alpine
    container_name: sin-shuffle-db
    hostname: shuffle-db
    networks:
      soc-net:
        ipv4_address: 10.22.0.42
    environment:
      - POSTGRES_USER=shuffle
      - POSTGRES_PASSWORD=${SHUFFLE_DB_PASSWORD:-ShuffleDB_2024!}
      - POSTGRES_DB=shuffle
    volumes:
      - shuffle_db_data:/var/lib/postgresql/data
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m  # LITE: era 256m

  # ===========================================================================
  # SOC NETWORK - VELOCIRAPTOR (DFIR) (REDUCIDO)
  # ===========================================================================
  velociraptor:
    image: wlambert/velociraptor:latest
    container_name: sin-velociraptor
    hostname: velociraptor
    networks:
      soc-net:
        ipv4_address: 10.22.0.33
    ports:
      - "8889:8889/tcp"   # Velociraptor GUI
      - "8000:8000/tcp"   # Frontend
    environment:
      - VELOX_FRONTEND_HOSTNAME=localhost
      - VELOX_SERVER_URL=https://localhost:8000/
    volumes:
      - velociraptor_data:/datastore
      - velociraptor_logs:/logs
      - ./config/velociraptor/server.config.yaml:/etc/velociraptor/server.config.yaml:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m  # LITE: era 512m

  # ===========================================================================
  # SOC NETWORK - GRAFANA (REDUCIDO)
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sin-grafana
    hostname: grafana
    networks:
      soc-net:
        ipv4_address: 10.22.0.60
    ports:
      - "3000:3000/tcp"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-Grafana_2024!}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # LITE: caché reducida
      - GF_DATAPROXY_TIMEOUT=30
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m  # LITE: era 512m

  # ===========================================================================
  # HONEYPOT NETWORK - LOW/MEDIUM INTERACTION HONEYPOTS (REDUCIDO)
  # ===========================================================================
  cowrie:
    image: cowrie/cowrie:latest
    container_name: sin-cowrie
    hostname: cowrie
    networks:
      honeypot-net:
        ipv4_address: 10.21.0.10
      dmz-net:
        ipv4_address: 10.20.0.50
    ports:
      - "2225:2222/tcp"   # SSH (redirected from 22) - remapped to avoid conflict
      - "2323:2223/tcp"   # Telnet
    environment:
      - COWRIE_HOSTNAME=sin-portal
    volumes:
      - cowrie_data:/cowrie/cowrie-git/var/lib/cowrie
      - ./config/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg.dist:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # dionaea: DESHABILITADO - las imágenes públicas de dionaea (dinotools, cowrie,
  # amazedostrich, etc.) tienen bugs (libpython3.so faltante, símbolos
  # indefinidos, version mismatch). SMB/FTP/MSSQL/SIP ya están cubiertos
  # por opencanary. Para reactivarlo, construir desde source.
  #
  # dionaea:
  #   image: cowrie/dionaea:latest
  #   container_name: sin-dionaea
  #   hostname: dionaea
  #   networks:
  #     honeypot-net:
  #       ipv4_address: 10.21.0.11
  #     dmz-net:
  #       ipv4_address: 10.20.0.51
  #   ports:
  #     - "1446:445/tcp"    # SMB - remapped (445/1445 reserved by Windows host)
  #     - "2122:21/tcp"     # FTP - remapped (2121 was held by old container)
  #     - "14333:1433/tcp"  # MSSQL - remapped
  #     - "5060:5060/udp"   # SIP
  #     - "5060:5060/tcp"
  #   volumes:
  #     - dionaea_data:/opt/dionaea/var
  #     - ./config/dionaea/dionaea.cfg:/opt/dionaea/etc/dionaea/dionaea.cfg:ro
  #   logging: *default-logging
  #   restart: unless-stopped
  #   mem_limit: 256m

  opencanary:
    image: thinkst/opencanary:latest
    container_name: sin-opencanary
    hostname: opencanary
    networks:
      honeypot-net:
        ipv4_address: 10.21.0.12
      dmz-net:
        ipv4_address: 10.20.0.52
    ports:
      - "8081:80/tcp"     # HTTP honeypot (HTTP-1)
      - "2121:21/tcp"     # FTP
      - "2223:22/tcp"     # SSH (secondary)
      - "13389:3389/tcp"  # RDP
      - "1445:445/tcp"    # SMB
      - "13306:3306/tcp"  # MySQL
      - "14330:1433/tcp"  # MSSQL
    volumes:
      - opencanary_data:/opt/opencanary
      - ./config/opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m  # LITE: era 256m

  heralding:
    image: dtagdevsec/heralding:24.04.1
    container_name: sin-heralding
    hostname: heralding
    user: "0:0"  # Run as root to allow cert generation in /heralding
    networks:
      honeypot-net:
        ipv4_address: 10.21.0.13
      dmz-net:
        ipv4_address: 10.20.0.53
    ports:
      - "23:23/tcp"       # Telnet (primary)
      - "1080:1080/tcp"   # SOCKS
      - "554:554/tcp"     # RTSP
      - "1723:1723/tcp"   # PPTP
    volumes:
      - heralding_data:/heralding
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m  # LITE: era 256m

  # ===========================================================================
  # HTTP PROXY FOR WAZUH INDEXER (used by TheHive / JanusGraph)
  # Translates HTTPS Wazuh (9200) to HTTP for clients that don't do SSL.
  # ===========================================================================
  wazuh-indexer-proxy:
    image: nginx:1.27-alpine
    container_name: sin-wazuh-indexer-proxy
    hostname: wazuh-indexer-proxy
    networks:
      soc-net:
        ipv4_address: 10.22.0.13
        aliases:
          - shuffle-opensearch  # Alias para que Shuffle encuentre el proxy
    ports:
      - "19200:9200/tcp"   # HTTP para health checks desde host (verificacion)
    volumes:
      - ./config/wazuh/indexer-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wazuh.indexer
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 64m

  # ===========================================================================
  # DMZ NETWORK - DECOY API TRIBUTARIA (REDUCIDO)
  # ===========================================================================
  decoy.api:
    build:
      context: ./decoys/api-tributaria
      dockerfile: Dockerfile
    image: sin/decoy-api:latest
    container_name: sin-decoy-api
    hostname: decoy-api
    networks:
      dmz-net:
        ipv4_address: 10.20.0.20
      soc-net:
        ipv4_address: 10.22.0.70
    ports:
      - "8090:8000/tcp"   # API exposed (mimics real port) - remapped to avoid conflict
    environment:
      - LOG_LEVEL=info
      - ATTACK_LOG=/var/log/decoy-api/attacks.json
      - FAKE_MODE=true
    volumes:
      - decoy_api_data:/app/data
      - decoy_api_logs:/var/log/decoy-api
    depends_on:
      - postgres.fiscal
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # ===========================================================================
  # DMZ NETWORK - DECOY PORTAL TRIBUTARIO (REDUCIDO)
  # ===========================================================================
  decoy.portal:
    build:
      context: ./decoys/portal-tributario
      dockerfile: Dockerfile
    image: sin/decoy-portal:latest
    container_name: sin-decoy-portal
    hostname: decoy-portal
    networks:
      dmz-net:
        ipv4_address: 10.20.0.21
      soc-net:
        ipv4_address: 10.22.0.71
    ports:
      - "8890:8000/tcp"   # Web portal exposed - remapped (8889 used by Velociraptor)
    environment:
      - DJANGO_DEBUG=true
      - DJANGO_SECRET_KEY=${DJANGO_SECRET:-PortalDjango_2024!}
      - ALLOWED_HOSTS=*
    volumes:
      - decoy_portal_data:/app/data
      - decoy_portal_logs:/var/log/portal
    depends_on:
      - postgres.fiscal
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # ===========================================================================
  # DMZ NETWORK - POSTGRESQL (synthetic fiscal data) (REDUCIDO)
  # ===========================================================================
  postgres.fiscal:
    image: postgres:15-alpine
    container_name: sin-postgres
    hostname: postgres-fiscal
    networks:
      dmz-net:
        ipv4_address: 10.20.0.30
      soc-net:
        ipv4_address: 10.22.0.80
    environment:
      - POSTGRES_USER=fiscal
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-FiscalDB_2024!}
      - POSTGRES_DB=sin_fiscal
    # LITE: configuración reducida
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./decoys/api-tributaria/data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m  # LITE: era 512m

  # ===========================================================================
  # IDS NETWORK - SURICATA NIDS (REDUCIDO)
  # ===========================================================================
  suricata:
    image: jasonish/suricata:7.0
    container_name: sin-suricata
    hostname: suricata
    networks:
      ids-net:
        ipv4_address: 10.23.0.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    environment:
      - SURICATA_OPTIONS=-i eth0 -c /etc/suricata/suricata.yaml
    volumes:
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./config/suricata/rules:/etc/suricata/rules:ro
      - suricata_logs:/var/log/suricata
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # ===========================================================================
  # IDS NETWORK - ZEEK NDR (REDUCIDO)
  # ===========================================================================
  zeek:
    image: zeek/zeek:6.0
    container_name: sin-zeek
    hostname: zeek
    networks:
      ids-net:
        ipv4_address: 10.23.0.11
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    environment:
      - ZEEK_IFACE=eth0
    volumes:
      - ./config/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./config/zeek/sin-notice.zeek:/usr/local/zeek/share/zeek/site/sin-notice.zeek:ro
      - zeek_logs:/var/log/zeek
    command: ["bash", "-c", "zeek -i eth0 local"]
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m  # LITE: era 512m

  # ===========================================================================
  # ATTACKER CONTAINER (REDUCIDO - CLI only)
  # ===========================================================================
  attacker:
    image: kalilinux/kali-rolling
    container_name: sin-attacker
    hostname: attacker
    networks:
      dmz-net:
        ipv4_address: 10.20.0.99
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    command: /bin/bash
    volumes:
      - ./attack-scenarios:/root/attack-scenarios
      - ./analysis:/root/analysis
    logging: *default-logging
    restart: "no"
    mem_limit: 1g  # LITE: era 2g

