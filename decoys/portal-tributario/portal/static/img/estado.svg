<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132" role="img" aria-label="Escudo de Bolivia">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9E300"/>
      <stop offset="100%" stop-color="#D4AF00"/>
    </linearGradient>
  </defs>

  <!-- Condor desplegado (superior) -->
  <g fill="#8A6D1F">
    <path d="M60 6 C48 0 36 2 30 8 C24 14 26 22 34 24 C40 25 44 21 46 17
             C48 24 52 28 58 30 C64 28 68 24 70 17 C72 21 76 25 82 24
             C90 22 92 14 86 8 C80 2 68 0 60 6 Z"/>
  </g>
  <path d="M60 4 L60 30" stroke="#6B5316" stroke-width="1.6"/>

  <!-- Corona de laurel y olivo (laterales) -->
  <g fill="#2E6B2E">
    <path d="M40 34 C28 40 20 54 20 70 C20 84 28 96 40 104 L45 100
             C34 92 27 82 27 70 C27 56 34 45 44 39 Z"/>
    <path d="M80 34 C92 40 100 54 100 70 C100 84 92 96 80 104 L75 100
             C86 92 93 82 93 70 C93 56 86 45 76 39 Z"/>
  </g>
  <g fill="#3E8B3E">
    <circle cx="24" cy="56" r="2.6"/><circle cx="22" cy="70" r="2.6"/><circle cx="25" cy="84" r="2.6"/>
    <circle cx="96" cy="56" r="2.6"/><circle cx="98" cy="70" r="2.6"/><circle cx="95" cy="84" r="2.6"/>
  </g>

  <!-- Escudo ovalado central -->
  <ellipse cx="60" cy="70" rx="26" ry="33" fill="url(#g1)" stroke="#8A6D1F" stroke-width="2"/>
  <!-- Franja superior: laUZ -->
  <clipPath id="clipEscudo">
    <ellipse cx="60" cy="70" rx="26" ry="33"/>
  </clipPath>
  <g clip-path="url(#clipEscudo)">
    <rect x="34" y="37" width="52" height="11" fill="#D52B1E"/>
    <rect x="34" y="48" width="52" height="11" fill="#007934"/>
    <!-- Cóndor en la franja roja -->
    <g fill="#3A2A08" transform="translate(60 42.5) scale(0.34)">
      <path d="M0 0 C-9 -4 -16 -3 -20 1 C-15 2 -11 0 -8 -3 C-7 1 -4 3 0 4
               C4 3 7 1 8 -3 C11 0 15 2 20 1 C16 -3 9 -4 0 0 Z"/>
    </g>
  </g>
  <!-- Sol sobre la franja verde -->
  <g fill="#F9E300" stroke="#D4AF00" stroke-width="0.8" transform="translate(60 53.5)">
    <circle r="3.2"/>
    <g stroke="#F9E300" stroke-width="0.9">
      <path d="M0 -4.6 V-5.6"/><path d="M0 4.6 V5.6"/><path d="M-4.6 0 H-5.6"/><path d="M4.6 0 H5.6"/>
      <path d="M-3.2 -3.2 L-3.9 -3.9"/><path d="M3.2 3.2 L3.9 3.9"/>
      <path d="M3.2 -3.2 L3.9 -3.9"/><path d="M-3.2 3.2 L-3.9 3.9"/>
    </g>
  </g>
  <!-- Cactus yjorqueño (inferior) -->
  <g fill="#1E5C1E" transform="translate(60 76)">
    <rect x="-1.6" y="-4" width="3.2" height="14" rx="1.6"/>
    <rect x="-9" y="-1" width="3" height="11" rx="1.5"/>
    <rect x="6" y="-1" width="3" height="11" rx="1.5"/>
    <circle cx="0" cy="-6" r="2.4"/>
    <circle cx="-7.5" cy="-3" r="2"/>
    <circle cx="7.5" cy="-3" r="2"/>
  </g>
  <!-- Chimborazo nevado -->
  <path d="M44 90 L54 80 L60 86 L66 80 L76 90 Z" fill="#5C6359"/>
  <path d="M50 84 L54 80 L58 84 L60 82 L62 84 L66 80 L70 84 Z" fill="#FFFFFF"/>

  <!-- Base con cinta -->
  <g fill="#2E6B2E">
    <path d="M34 100 C42 112 78 112 86 100 L90 104 C80 120 40 120 30 104 Z"/>
  </g>
  <text x="60" y="116" text-anchor="middle" font-family="Montserrat, sans-serif"
        font-size="8.5" font-weight="700" fill="#D52B1E" letter-spacing="0.6">BOLIVIA</text>
</svg>
